server:
  port: 7080

spring:
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # MySQL 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/emoji_converter?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: '996012'
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate 配置
  jpa:
    hibernate:
      ddl-auto: update                    # 自动创建/更新表结构
    show-sql: false                        # 生产环境关闭SQL日志
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # SQL 初始化（可选）
  sql:
    init:
      mode: never                          # 不自动执行SQL文件，我们手动创建表

# JWT 配置
security:
  jwt:
    secret: emoji-converter-secret-key-must-be-at-least-32-characters-long!
    expiration: 3600000

  auth:
    login-path: /aaaa/dskqrb
    username: emoji
    password: emoji98540

# 匹配器配置（对应 Python 的 config.py）
matcher:
  max-window: 4
  max-candidates-per-key: 80
  enable-fuzzy: true
  enable-single-syllable: true
  tts-priority-bonus: 20
  position-first-bonus: 20
  position-last-bonus: 10
  fuzzy-priority-penalty: 50

# 日志配置
logging:
  level:
    com.emoji.converter: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
