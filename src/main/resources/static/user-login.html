<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 登录 / 注册 - Emoji 转换器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 460px;
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .auth-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .auth-header h1 {
            font-size: 1.8em;
            margin-bottom: 8px;
        }

        .auth-header p {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .auth-body {
            padding: 35px 30px;
        }

        .tab-container {
            display: flex;
            margin-bottom: 28px;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            color: #666;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .tab-btn:hover:not(.active) {
            color: #333;
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 0.9em;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
            background: #fafafa;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }

        .form-input::placeholder {
            color: #999;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.3em;
            color: #666;
            padding: 4px;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: #667eea;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
            margin-top: 10px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102,126,234,0.5);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message-box {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.9em;
            display: none;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .message-box.error {
            background: #fee;
            color: #c33;
            display: block;
        }

        .message-box.success {
            background: #efe;
            color: #3a3;
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hint-text {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
        }

        .hint-text p {
            color: #888;
            font-size: 0.85em;
            line-height: 1.6;
        }

        .back-link {
            text-align: center;
            margin-top: 18px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.95em;
            transition: opacity 0.3s;
        }

        .back-link a:hover {
            opacity: 0.8;
        }

        .features-list {
            text-align: left;
            margin-top: 15px;
            padding-left: 20px;
        }

        .features-list li {
            color: #666;
            font-size: 0.85em;
            line-height: 1.8;
        }

        @media (max-width: 480px) {
            .auth-container {
                max-width: 100%;
                margin: 10px;
            }

            .auth-body {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🎭 Emoji 转换器</h1>
            <p id="headerSubtitle">登录以解锁更多功能</p>
        </div>

        <div class="auth-body">
            <div id="errorMessage" class="message-box error"></div>
            <div id="successMessage" class="message-box success"></div>

            <!-- Tab 切换 -->
            <div class="tab-container">
                <button type="button" class="tab-btn active" onclick="switchTab('login')" id="loginTab">登录</button>
                <button type="button" class="tab-btn" onclick="switchTab('register')" id="registerTab">注册</button>
            </div>

            <!-- 登录表单 -->
            <div id="loginPanel" class="form-panel active">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input
                            type="text"
                            class="form-input"
                            id="loginUsername"
                            placeholder="请输入用户名"
                            required
                            autocomplete="username"
                            autofocus
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <div class="password-wrapper">
                            <input
                                type="password"
                                class="form-input"
                                id="loginPassword"
                                placeholder="请输入密码"
                                required
                                autocomplete="current-password"
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)" title="显示/隐藏密码">
                                👁️
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="loginBtn">
                        🚀 登录
                    </button>
                </form>
            </div>

            <!-- 注册表单 -->
            <div id="registerPanel" class="form-panel">
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label">用户名 *</label>
                        <input
                            type="text"
                            class="form-input"
                            id="regUsername"
                            placeholder="3-50个字符"
                            required
                            autocomplete="username"
                            minlength="3"
                            maxlength="50"
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label">昵称（可选）</label>
                        <input
                            type="text"
                            class="form-input"
                            id="regNickname"
                            placeholder="显示名称"
                            autocomplete="nickname"
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label">邮箱（可选）</label>
                        <input
                            type="email"
                            class="form-input"
                            id="regEmail"
                            placeholder="your@email.com"
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label">密码 *</label>
                        <div class="password-wrapper">
                            <input
                                type="password"
                                class="form-input"
                                id="regPassword"
                                placeholder="至少6个字符"
                                required
                                autocomplete="new-password"
                                minlength="6"
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('regPassword', this)" title="显示/隐藏密码">
                                👁️
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">确认密码 *</label>
                        <div class="password-wrapper">
                            <input
                                type="password"
                                class="form-input"
                                id="regConfirmPassword"
                                placeholder="再次输入密码"
                                required
                                autocomplete="new-password"
                                minlength="6"
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('regConfirmPassword', this)" title="显示/隐藏密码">
                                👁️
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="registerBtn">
                        ✨ 免费注册
                    </button>
                </form>
            </div>

            <div class="hint-text">
                <p>🎁 注册即可享受：</p>
                <ul class="features-list">
                    <li>✅ 自定义Emoji映射规则</li>
                    <li>✅ 管理个人转换偏好</li>
                    <li>✅ 数据云端同步</li>
                    <li>✅ 基础功能永久免费</li>
                </ul>
            </div>

            <div class="back-link">
                <a href="/">← 返回首页（无需登录）</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/auth';

        // 页面加载时检查是否需要自动切换到注册Tab
        window.addEventListener('load', function() {
            if (window.location.hash === '#register') {
                switchTab('register');
            } else {
                document.getElementById('loginUsername').focus();
            }
        });

        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginPanel = document.getElementById('loginPanel');
            const registerPanel = document.getElementById('registerPanel');
            const headerSubtitle = document.getElementById('headerSubtitle');

            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginPanel.classList.add('active');
                registerPanel.classList.remove('active');
                headerSubtitle.textContent = '登录以解锁更多功能';
                document.getElementById('loginUsername').focus();
                window.history.replaceState(null, null, '/login');  // 清除URL中的hash
            } else {
                loginTab.classList.remove('active');
                registerTab.classList.add('active');
                loginPanel.classList.remove('active');
                registerPanel.classList.add('active');
                headerSubtitle.textContent = '创建免费账户';
                document.getElementById('regUsername').focus();
                window.history.replaceState(null, null, '/login#register');  // 在URL中添加hash
            }

            hideMessages();
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);

            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function showError(message) {
            hideMessages();
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('error');

            setTimeout(() => {
                errorDiv.classList.remove('error');
            }, 5000);
        }

        function showSuccess(message) {
            hideMessages();
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('success');
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('error');
            document.getElementById('successMessage').classList.remove('success');
        }

        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');

            if (!username || !password) {
                showError('请填写用户名和密码');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span>正在验证...';

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showSuccess('✅ 登录成功！正在跳转到首页...');

                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('auth_user', JSON.stringify(data.user));
                    localStorage.setItem('auth_expires', Date.now() + data.expires_in * 1000);

                    // 延迟跳转到首页（不是管理后台）
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);

                } else {
                    showError(data.error || '用户名或密码错误');

                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '🚀 登录';
                    document.getElementById('loginPassword').value = '';
                    document.getElementById('loginPassword').focus();
                }

            } catch (error) {
                showError('网络错误，请稍后重试');

                loginBtn.disabled = false;
                loginBtn.innerHTML = '🚀 登录';
            }
        }

        async function handleRegister(event) {
            event.preventDefault();

            const username = document.getElementById('regUsername').value.trim();
            const nickname = document.getElementById('regNickname').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const registerBtn = document.getElementById('registerBtn');

            if (!username || username.length < 3) {
                showError('用户名至少需要3个字符');
                return;
            }

            if (!password || password.length < 6) {
                showError('密码至少需要6个字符');
                return;
            }

            if (password !== confirmPassword) {
                showError('两次输入的密码不一致');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="loading-spinner"></span>正在注册...';

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username,
                        nickname,
                        email,
                        password,
                        confirmPassword
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showSuccess('✅ 注册成功！欢迎加入！');

                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('auth_user', JSON.stringify(data.user));
                    localStorage.setItem('auth_expires', Date.now() + data.expires_in * 1000);

                    // 延迟跳转到首页
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);

                } else {
                    showError(data.error || '注册失败');

                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '✨ 免费注册';
                }

            } catch (error) {
                showError('网络错误，请稍后重试');

                registerBtn.disabled = false;
                registerBtn.innerHTML = '✨ 免费注册';
            }
        }
    </script>
</body>
</html>
