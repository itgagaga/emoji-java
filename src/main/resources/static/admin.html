<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎛️ Emoji 映射管理中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.95;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 1em;
        }

        .main-content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.6em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group select {
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .emoji-input-wrapper {
            position: relative;
        }

        .emoji-input {
            font-size: 1em !important;
            padding-left: 32px !important;
            height: 42px;
        }

        .emoji-picker-btn {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1em;
            cursor: pointer;
            background: none;
            border: none;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex: 1;
            min-width: 300px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-group select {
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95em;
            cursor: pointer;
        }

        .mappings-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .mappings-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .mappings-table th {
            padding: 18px 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mappings-table tbody tr {
            background: white;
            transition: all 0.3s ease;
        }

        .mappings-table tbody tr:hover {
            background: #f8f9ff;
            transform: scale(1.01);
        }

        .mappings-table tbody tr.admin-row {
            background: linear-gradient(to right, #fff5e6, #ffffff);
        }

        .mappings-table tbody tr.admin-row:hover {
            background: linear-gradient(to right, #ffe8cc, #f8f9ff);
        }

        .mappings-table td {
            padding: 16px 15px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }

        .type-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .type-badge.pinyin {
            background: #e3f2fd;
            color: #1976d2;
        }

        .type-badge.word {
            background: #fce4ec;
            color: #c2185b;
        }

        .source-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 500;
        }

        .source-badge.original {
            background: #f0f0f0;
            color: #666;
        }

        .source-badge.admin {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            color: white;
        }

        .priority-bar {
            width: 120px;
            height: 24px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .priority-fill {
            height: 100%;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            border-radius: 12px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            font-size: 0.75em;
            font-weight: 600;
            color: white;
            min-width: fit-content;
        }

        .actions-cell {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 26px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #666;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            z-index: 9999;
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .toast.error {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 998;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                min-width: auto;
            }
            
            .mappings-table {
                font-size: 0.85em;
            }
            
            .mappings-table th,
            .mappings-table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Header -->
        <div class="header">
            <h1>🎛️ Emoji 映射管理中心</h1>
            <p>管理员专属 · 增量映射配置 · 全局生效</p>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="totalMappings">0</div>
                <div class="stat-label">管理员映射总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="enabledMappings">0</div>
                <div class="stat-label">已启用</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⛔</div>
                <div class="stat-value" id="disabledMappings">0</div>
                <div class="stat-label">已禁用</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔤</div>
                <div class="stat-value" id="pinyinCount">0</div>
                <div class="stat-label">拼音映射</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <div class="stat-value" id="wordCount">0</div>
                <div class="stat-label">词语映射</div>
            </div>
        </div>

        <!-- Add New Mapping Section -->
        <div class="main-content">
            <h2 class="section-title">➕ 新增映射</h2>
            <form id="addMappingForm" onsubmit="return false;">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="mappingType">映射类型 *</label>
                        <select id="mappingType" required>
                            <option value="pinyin">拼音映射（支持单字/词语拼音）</option>
                            <option value="word">词语映射（中文词语）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="mappingKey">Key（拼音/词语）*</label>
                        <input type="text" id="mappingKey" placeholder="拼音: shu / shu ji / kai xin | 词语: 开心" required>
                    </div>
                    <div class="form-group">
                        <label for="mappingEmoji">Emoji *</label>
                        <div class="emoji-input-wrapper">
                            <button type="button" class="emoji-picker-btn" onclick="document.getElementById('mappingEmoji').focus()">😀</button>
                            <input type="text" id="mappingEmoji" class="emoji-input" placeholder="输入或粘贴 Emoji" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="mappingDesc">描述（可选）</label>
                        <input type="text" id="mappingDesc" placeholder="例如: 书籍、开心等">
                    </div>
                    <div class="form-group">
                        <label for="mappingPriority">优先级 (≥150)</label>
                        <input type="number" id="mappingPriority" placeholder="默认150" min="150" max="999" value="150">
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end;">
                        <button type="submit" class="btn btn-primary" onclick="addMapping()">
                            🚀 添加映射
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Mappings List Section -->
        <div class="main-content">
            <h2 class="section-title">📋 映射列表（管理员自定义）</h2>
            
            <!-- Toolbar -->
            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 搜索 Key/Emoji/描述..." onkeyup="debounceSearch()">
                </div>
                <div class="filter-group">
                    <select id="typeFilter" onchange="loadMappings()">
                        <option value="">全部类型</option>
                        <option value="pinyin">拼音映射</option>
                        <option value="word">词语映射</option>
                    </select>
                    <select id="statusFilter" onchange="loadMappings()">
                        <option value="">全部状态</option>
                        <option value="enabled">已启用</option>
                        <option value="disabled">已禁用</option>
                    </select>
                    <button class="btn btn-success btn-sm" onclick="loadMappings()">🔄 刷新</button>
                </div>
            </div>

            <!-- Table -->
            <table class="mappings-table" id="mappingsTable">
                <thead>
                    <tr>
                        <th>类型</th>
                        <th>Key</th>
                        <th>Emoji</th>
                        <th>描述</th>
                        <th>优先级</th>
                        <th>来源</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="mappingsBody">
                    <tr>
                        <td colspan="8" class="empty-state">
                            <div class="icon">📭</div>
                            <h3>暂无映射数据</h3>
                            <p>添加您的第一个管理员映射吧！</p>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Pagination -->
            <div style="margin-top: 20px; text-align: center;" id="pagination"></div>
        </div>

        <!-- View All Mappings Section (NEW) -->
        <div class="main-content">
            <h2 class="section-title">🔍 查看全部映射</h2>
            
            <!-- Stats Bar for All Mappings -->
            <div id="allMappingsStats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
                <div style="background: linear-gradient(135deg, #667eea10, #764ba210); padding: 15px; border-radius: 12px; text-align: center; border-left: 4px solid #667eea;">
                    <div style="font-size: 24px; font-weight: bold; color: #667eea;" id="totalAllCount">0</div>
                    <div style="color: #666; font-size: 13px;">总映射数</div>
                </div>
                <div style="background: linear-gradient(135deg, #e8f5e9, #c8e6c9); padding: 15px; border-radius: 12px; text-align: center; border-left: 4px solid #4caf50;">
                    <div style="font-size: 24px; font-weight: bold; color: #2e7d32;" id="originalCount">0</div>
                    <div style="color: #666; font-size: 13px;">原始数据</div>
                </div>
                <div style="background: linear-gradient(135deg, #fff3e0, #ffe0b2); padding: 15px; border-radius: 12px; text-align: center; border-left: 4px solid #ff9800;">
                    <div style="font-size: 24px; font-weight: bold; color: #ef6c00;" id="adminAllCount">0</div>
                    <div style="color: #666; font-size: 13px;">管理员自定义</div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar" style="margin-bottom: 20px;">
                <div class="search-box">
                    <input type="text" id="allSearchInput" placeholder="🔍 搜索 Key/Emoji/描述..." onkeyup="debounceAllSearch()">
                </div>
                <div class="filter-group">
                    <select id="sourceFilter" onchange="loadAllMappings(1)">
                        <option value="">全部来源</option>
                        <option value="original">原始数据</option>
                        <option value="admin">管理员自定义</option>
                    </select>
                    <select id="typeFilterAll" onchange="loadAllMappings(1)">
                        <option value="">全部类型</option>
                        <option value="pinyin">拼音映射</option>
                        <option value="word">词语映射</option>
                    </select>
                    <button class="btn btn-success btn-sm" onclick="loadAllMappings(1)">🔄 刷新</button>
                </div>
            </div>

            <!-- Table -->
            <table class="mappings-table" id="allMappingsTable">
                <thead>
                    <tr>
                        <th>来源</th>
                        <th>类型</th>
                        <th>Key</th>
                        <th>Emoji</th>
                        <th>描述</th>
                        <th>优先级</th>
                        <th>索引类型</th>
                        <th>状态</th>
                        <th style="width: 150px;">操作</th>
                    </tr>
                </thead>
                <tbody id="allMappingsBody">
                    <tr>
                        <td colspan="9" class="empty-state">
                            <div class="icon">📊</div>
                            <h3>加载中...</h3>
                            <p>正在获取所有映射数据</p>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Pagination -->
            <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;" id="allPagination">
                <div id="allPageInfo"></div>
                <div id="allPageControls"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/admin/mappings';
        let currentPage = 1;
        const pageSize = 20;

        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadMappings();
        });

        function getAuthToken() {
            return localStorage.getItem('auth_token');
        }

        function getHeaders() {
            const token = getAuthToken();
            if (!token) {
                window.location.href = '/aaaa/dskqrb';
                return null;
            }
            return {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`, {
                    headers: getHeaders()
                });
                
                if (response.status === 401) {
                    window.location.href = '/aaaa/dskqrb';
                    return;
                }
                
                const data = await response.json();
                if (data.success && data.stats) {
                    animateValue('totalMappings', 0, data.stats.total, 800);
                    animateValue('enabledMappings', 0, data.stats.enabled, 800);
                    animateValue('disabledMappings', 0, data.stats.disabled, 800);
                    
                    const byType = data.stats.byType || {};
                    document.getElementById('pinyinCount').textContent = byType.pinyin || 0;
                    document.getElementById('wordCount').textContent = byType.word || 0;
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }

        async function loadMappings() {
            showLoading();
            
            try {
                let url = `${API_BASE}?`;
                const keyword = document.getElementById('searchInput').value.trim();
                const typeFilter = document.getElementById('typeFilter').value;
                
                if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;
                if (typeFilter) url += `&type=${typeFilter}`;
                
                const response = await fetch(url, {
                    headers: getHeaders()
                });
                
                if (response.status === 401) {
                    window.location.href = '/aaaa/dskqrb';
                    return;
                }
                
                const data = await response.json();
                
                if (data.success) {
                    renderMappings(data.mappings || []);
                } else {
                    showToast(data.error || '加载数据失败', 'error');
                }
            } catch (error) {
                console.error('加载映射失败:', error);
                showToast('网络错误，请重试', 'error');
            } finally {
                hideLoading();
            }
        }

        function renderMappings(mappings) {
            const tbody = document.getElementById('mappingsBody');
            
            if (mappings.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-state">
                            <div class="icon">📭</div>
                            <h3>暂无数据</h3>
                            <p>${document.getElementById('searchInput').value ? '没有找到匹配的映射' : '添加您的第一个管理员映射吧！'}</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = mappings.map(m => `
                <tr class="admin-row">
                    <td>
                        <span class="type-badge ${m.type}">${m.type === 'pinyin' ? '🔤 拼音' : '📝 词语'}</span>
                    </td>
                    <td><strong>${escapeHtml(m.key)}</strong></td>
                    <td style="font-size: 1.8em;">${m.emoji}</td>
                    <td>${escapeHtml(m.description || '-')}</td>
                    <td>
                        <div class="priority-bar">
                            <div class="priority-fill" style="width: ${Math.min(m.priority / 2, 100)}%">
                                ${m.priority}
                            </div>
                        </div>
                    </td>
                    <td><span class="source-badge admin">👨‍💼 管理员</span></td>
                    <td>
                        <label class="toggle-switch">
                            <input type="checkbox" ${m.enabled ? 'checked' : ''} 
                                   onchange="toggleMapping('${m.id}', this.checked)">
                            <span class="toggle-slider"></span>
                        </label>
                    </td>
                    <td>
                        <div class="actions-cell">
                            <button class="btn btn-warning btn-sm" onclick="editPriority('${m.id}', ${m.priority})" title="修改优先级">
                                📊
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="deleteMapping('${m.id}', '${m.key}', '${m.emoji}')" title="删除">
                                🗑️
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function addMapping() {
            const type = document.getElementById('mappingType').value;
            const key = document.getElementById('mappingKey').value.trim();
            const emoji = document.getElementById('mappingEmoji').value.trim();
            const description = document.getElementById('mappingDesc').value.trim();
            const priority = parseInt(document.getElementById('mappingPriority').value) || 150;

            if (!key || !emoji) {
                showToast('请填写必填字段', 'error');
                return;
            }

            try {
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        type: type,
                        key: key,
                        emoji: emoji,
                        description: description,
                        priority: priority
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showToast(`✅ 成功添加映射: ${key} → ${emoji}`, 'success');
                    document.getElementById('addMappingForm').reset();
                    document.getElementById('mappingPriority').value = 150;
                    loadStats();
                    loadMappings();
                } else {
                    showToast(data.error || '添加失败', 'error');
                }
            } catch (error) {
                console.error('添加映射失败:', error);
                showToast('网络错误', 'error');
            }
        }

        async function toggleMapping(id, enabled) {
            try {
                const response = await fetch(`${API_BASE}/${id}/toggle`, {
                    method: 'PUT',
                    headers: getHeaders(),
                    body: JSON.stringify({ enabled: enabled })
                });

                const data = await response.json();

                if (data.success) {
                    showToast(enabled ? '✅ 已启用' : '⛔ 已禁用', 'success');
                    loadStats();
                } else {
                    showToast(data.error || '操作失败', 'error');
                    loadMappings();
                }
            } catch (error) {
                console.error('切换状态失败:', error);
                showToast('网络错误', 'error');
                loadMappings();
            }
        }

        async function editPriority(id, currentPriority) {
            const newPriority = prompt(`当前优先级: ${currentPriority}\n请输入新的优先级 (≥150):`, currentPriority);
            
            if (newPriority === null) return;
            
            const priority = parseInt(newPriority);
            if (isNaN(priority) || priority < 150) {
                showToast('优先级必须 ≥ 150', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/${id}/priority`, {
                    method: 'PUT',
                    headers: getHeaders(),
                    body: JSON.stringify({ priority: priority })
                });

                const data = await response.json();

                if (data.success) {
                    showToast(`📊 优先级已更新为: ${priority}`, 'success');
                    loadMappings();
                } else {
                    showToast(data.error || '更新失败', 'error');
                }
            } catch (error) {
                console.error('更新优先级失败:', error);
                showToast('网络错误', 'error');
            }
        }

        async function deleteMapping(id, key, emoji) {
            if (!confirm(`确定要删除映射 "${key} → ${emoji}" 吗？\n\n此操作不可恢复！`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/${id}`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });

                const data = await response.json();

                if (data.success) {
                    showToast(`🗑️ 已删除映射: ${key} → ${emoji}`, 'success');
                    loadStats();
                    loadMappings();
                } else {
                    showToast(data.error || '删除失败', 'error');
                }
            } catch (error) {
                console.error('删除映射失败:', error);
                showToast('网络错误', 'error');
            }
        }

        let searchTimeout;
        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadMappings();
            }, 400);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function animateValue(elementId, start, end, duration) {
            const element = document.getElementById(elementId);
            const range = end - start;
            const startTime = performance.now();
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const value = Math.floor(start + range * progress);
                element.textContent = value;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            requestAnimationFrame(update);
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideInRight 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showLoading() {
            const overlay = document.createElement('div');
            overlay.className = 'loading-overlay';
            overlay.id = 'loadingOverlay';
            overlay.innerHTML = '<div class="spinner"></div>';
            document.body.appendChild(overlay);
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.remove();
        }

        // ========== View All Mappings Functions ==========
        let allCurrentPage = 1;
        const allPageSize = 20;

        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadMappings();
            loadAllMappings(1);
        });

        function debounceAllSearch() {
            clearTimeout(window.allSearchTimeout);
            window.allSearchTimeout = setTimeout(() => loadAllMappings(1), 500);
        }

        async function loadAllMappings(page = 1) {
            allCurrentPage = page;
            
            try {
                let url = `${API_BASE}/all?page=${page}&size=${allPageSize}`;
                
                const sourceFilter = document.getElementById('sourceFilter').value;
                const typeFilter = document.getElementById('typeFilterAll').value;
                const keyword = document.getElementById('allSearchInput').value.trim();
                
                if (sourceFilter) url += `&source=${encodeURIComponent(sourceFilter)}`;
                if (typeFilter) url += `&type=${encodeURIComponent(typeFilter)}`;
                if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;
                
                const response = await fetch(url, {
                    headers: getHeaders()
                });
                
                if (response.status === 401) {
                    window.location.href = '/aaaa/dskqrb';
                    return;
                }
                
                const data = await response.json();
                
                if (data.success) {
                    renderAllMappings(data.mappings || [], data.pagination, data.stats);
                } else {
                    showToast(data.error || '加载失败', 'error');
                }
            } catch (error) {
                console.error('加载全部映射失败:', error);
                showToast('网络错误，请重试', 'error');
            }
        }

        function renderAllMappings(mappings, pagination, stats) {
            // Update Stats
            if (stats) {
                animateValue('totalAllCount', 0, pagination.totalElements, 800);
                animateValue('originalCount', 0, stats.originalCount, 800);
                animateValue('adminAllCount', 0, stats.adminCount, 800);
            }
            
            // Render Table
            const tbody = document.getElementById('allMappingsBody');
            
            if (mappings.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty-state">
                            <div class="icon">📭</div>
                            <h3>暂无数据</h3>
                            <p>${document.getElementById('allSearchInput').value ? '没有找到匹配的映射' : '暂无映射数据'}</p>
                        </td>
                    </tr>
                `;
                document.getElementById('allPageInfo').innerHTML = '';
                document.getElementById('allPageControls').innerHTML = '';
                return;
            }
            
            tbody.innerHTML = mappings.map(m => {
                const sourceBadge = m.source === 'admin' 
                    ? '<span style="background: #ff9800; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;">管理员</span>'
                    : '<span style="background: #4caf50; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;">原始</span>';
                
                const typeLabel = m.type === 'pinyin' ? '拼音' : '词语';
                const typeClass = m.type === 'pinyin' ? 'type-pinyin_exact' : 'type-word';
                
                const indexTypeLabels = {
                    'word': '直接词',
                    'pinyin_exact': '拼音精准',
                    'pinyin_syllable': '单音节',
                    'pinyin_fuzzy': '模糊音'
                };
                const indexTypeLabel = indexTypeLabels[m.indexType] || m.indexType;
                const indexTypeClass = `type-${m.indexType}`;
                
                // Status Badge with Toggle Button (for all mappings)
                let statusCell = '';
                statusCell = m.enabled
                    ? `<button class="btn btn-sm" style="background: #4caf50; color: white;" onclick="toggleMappingStatus('${m.id}', '${m.type}', '${m.key}', false, this)">✅ 启用</button>`
                    : `<button class="btn btn-sm" style="background: #f44336; color: white;" onclick="toggleMappingStatus('${m.id}', '${m.type}', '${m.key}', true, this)">❌ 禁用</button>`;
                
                // Action Buttons (for all mappings)
                let actionCell = '';
                actionCell = `
                    <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                        <button class="btn btn-sm btn-primary" onclick="showPriorityEditor('${m.id}', '${m.type}', '${m.key}', ${m.priority}, '${escapeHtml(m.key)}')" title="修改优先级">⚙️</button>
                        ${statusCell}
                    </div>
                `;
                
                return `
                    <tr id="row-${m.id}" class="${m.source === 'admin' ? 'admin-row' : ''}">
                        <td>${sourceBadge}</td>
                        <td><span class="dropdown-type ${typeClass}">${typeLabel}</span></td>
                        <td style="font-family: monospace; font-weight: 600;">${escapeHtml(m.key)}</td>
                        <td><span style="font-size: 24px;">${m.emoji}</span></td>
                        <td>${escapeHtml(m.description || '-')}</td>
                        <td><strong id="priority-${m.id}">${m.priority}</strong></td>
                        <td><span class="dropdown-type ${indexTypeClass}">${indexTypeLabel}</span></td>
                        <td>${statusCell}</td>
                        <td>${actionCell}</td>
                    </tr>
                `;
            }).join('');
            
            // Render Pagination
            renderAllPagination(pagination);
        }

        // ========== Action Functions ==========
        
        async function toggleMappingStatus(mappingId, type, key, newEnabled, buttonElement) {
            try {
                const originalText = buttonElement.innerHTML;
                buttonElement.disabled = true;
                buttonElement.innerHTML = '⏳...';
                
                let response;
                
                if (mappingId.startsWith('adm_')) {
                    // 管理员自定义映射
                    response = await fetch(`${API_BASE}/${mappingId}/toggle`, {
                        method: 'PUT',
                        headers: getHeaders(),
                        body: JSON.stringify({ enabled: newEnabled })
                    });
                } else if (mappingId.startsWith('orig-')) {
                    // 原始数据映射
                    response = await fetch(`${API_BASE}/original/${encodeURIComponent(type)}/${encodeURIComponent(key)}/toggle`, {
                        method: 'PUT',
                        headers: getHeaders(),
                        body: JSON.stringify({ enabled: newEnabled })
                    });
                }
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(data.message, 'success');
                    
                    // Update UI
                    if (newEnabled) {
                        buttonElement.style.background = '#4caf50';
                        buttonElement.innerHTML = '✅ 启用';
                        buttonElement.setAttribute('onclick', `toggleMappingStatus('${mappingId}', '${type}', '${key}', false, this)`);
                        
                        // Re-enable row
                        const row = document.getElementById(`row-${mappingId}`);
                        if (row) row.style.opacity = '1';
                    } else {
                        buttonElement.style.background = '#f44336';
                        buttonElement.innerHTML = '❌ 禁用';
                        buttonElement.setAttribute('onclick', `toggleMappingStatus('${mappingId}', '${type}', '${key}', true, this)`);
                        
                        // Dim disabled row
                        const row = document.getElementById(`row-${mappingId}`);
                        if (row) row.style.opacity = '0.5';
                    }
                } else {
                    showToast(data.error || '操作失败', 'error');
                    buttonElement.innerHTML = originalText;
                }
            } catch (error) {
                console.error('切换状态失败:', error);
                showToast('网络错误，请重试', 'error');
                buttonElement.innerHTML = originalText;
            } finally {
                buttonElement.disabled = false;
            }
        }

        function showPriorityEditor(mappingId, type, key, currentPriority, keyName) {
            const priorityCell = document.getElementById(`priority-${mappingId}`);
            
            // Create editor
            const editorHtml = `
                <div style="display: flex; gap: 5px; align-items: center;">
                    <input type="number" id="priority-input-${mappingId}" 
                           value="${currentPriority}" 
                           min="150" max="999" 
                           style="width: 70px; padding: 4px; border: 2px solid #667eea; border-radius: 6px; font-weight: bold;">
                    <button class="btn btn-sm" style="background: #4caf50; color: white;" onclick="savePriority('${mappingId}', '${type}', '${key}')">✓</button>
                    <button class="btn btn-sm" style="background: #f44336; color: white;" onclick="cancelPriorityEdit('${mappingId}', ${currentPriority})">✕</button>
                </div>
            `;
            
            priorityCell.innerHTML = editorHtml;
            
            // Focus input and select all
            setTimeout(() => {
                const input = document.getElementById(`priority-input-${mappingId}`);
                if (input) {
                    input.focus();
                    input.select();
                }
            }, 100);
        }

        async function savePriority(mappingId, type, key) {
            const input = document.getElementById(`priority-input-${mappingId}`);
            const newPriority = parseInt(input.value);
            
            if (isNaN(newPriority) || newPriority < 150 || newPriority > 999) {
                showToast('优先级必须在 150-999 之间', 'error');
                return;
            }
            
            try {
                let response;
                
                if (mappingId.startsWith('adm_')) {
                    // 管理员自定义映射
                    response = await fetch(`${API_BASE}/${mappingId}/priority`, {
                        method: 'PUT',
                        headers: getHeaders(),
                        body: JSON.stringify({ priority: newPriority })
                    });
                } else if (mappingId.startsWith('orig-')) {
                    // 原始数据映射
                    response = await fetch(`${API_BASE}/original/${encodeURIComponent(type)}/${encodeURIComponent(key)}/priority`, {
                        method: 'PUT',
                        headers: getHeaders(),
                        body: JSON.stringify({ priority: newPriority })
                    });
                }
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(`优先级已更新为 ${newPriority}`, 'success');
                    
                    // Update display
                    const priorityCell = document.getElementById(`priority-${mappingId}`);
                    priorityCell.innerHTML = `<strong>${newPriority}</strong>`;
                    
                    // Refresh to see changes in order
                    loadAllMappings(allCurrentPage);
                } else {
                    showToast(data.error || '更新失败', 'error');
                }
            } catch (error) {
                console.error('更新优先级失败:', error);
                showToast('网络错误，请重试', 'error');
            }
        }

        function cancelPriorityEdit(mappingId, originalValue) {
            const priorityCell = document.getElementById(`priority-${mappingId}`);
            priorityCell.innerHTML = `<strong>${originalValue}</strong>`;
        }

        // Keyboard shortcut for priority input
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('priority-input-')) {
                const mappingId = e.target.id.replace('priority-input-', '');
                savePriority(mappingId);
            }
            if (e.key === 'Escape' && e.target.id && e.target.id.startsWith('priority-input-')) {
                e.target.blur();
            }
        });

        function renderAllPagination(pagination) {
            const pageInfo = document.getElementById('allPageInfo');
            const pageControls = document.getElementById('allPageControls');
            
            pageInfo.innerHTML = `
                <span style="color: #666;">
                    显示第 <strong>${pagination.page * pagination.size - pagination.size + 1}</strong> - 
                    <strong>${Math.min(pagination.page * pagination.size, pagination.totalElements)}</strong> 条，
                    共 <strong>${pagination.totalElements}</strong> 条记录
                </span>
            `;
            
            if (pagination.totalPages <= 1) {
                pageControls.innerHTML = '';
                return;
            }
            
            let html = '';
            
            // Previous Button
            html += `<button class="btn btn-sm" onclick="loadAllMappings(${pagination.page - 1})" 
                      ${!pagination.hasPrev ? 'disabled style="opacity: 0.5;"' : ''}>◀ 上一页</button>`;
            
            // Page Numbers
            const maxVisiblePages = 5;
            let startPage = Math.max(1, pagination.page - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(pagination.totalPages, startPage + maxVisiblePages - 1);
            
            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }
            
            if (startPage > 1) {
                html += `<button class="btn btn-sm" onclick="loadAllMappings(1)">1</button>`;
                if (startPage > 2) html += `<span style="padding: 5px;">...</span>`;
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const isActive = i === pagination.page;
                html += `<button class="btn btn-sm" onclick="loadAllMappings(${i})" 
                          style="${isActive ? 'background: #667eea; color: white;' : ''}">${i}</button>`;
            }
            
            if (endPage < pagination.totalPages) {
                if (endPage < pagination.totalPages - 1) html += `<span style="padding: 5px;">...</span>`;
                html += `<button class="btn btn-sm" onclick="loadAllMappings(${pagination.totalPages})">${pagination.totalPages}</button>`;
            }
            
            // Next Button
            html += `<button class="btn btn-sm" onclick="loadAllMappings(${pagination.page + 1})" 
                      ${!pagination.hasNext ? 'disabled style="opacity: 0.5;"' : ''}>下一页 ▶</button>`;
            
            pageControls.innerHTML = html;
        }
    </script>
</body>
</html>
