<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字转Emoji转换器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .input-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .input-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .input-area {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            transition: all 0.3s ease;
            line-height: 1.6;
        }

        .input-area:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 15px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-weight: 500;
            color: #555;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #667eea;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .examples {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .examples-title {
            font-weight: 600;
            color: #555;
            margin-bottom: 10px;
        }

        .example-item {
            display: inline-block;
            padding: 6px 12px;
            margin: 5px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .example-item:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .output-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 968px) {
            .output-grid {
                grid-template-columns: 1fr;
            }
        }

        .output-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .output-card.word-mode {
            border-top: 4px solid #667eea;
        }

        .output-card.char-mode {
            border-top: 4px solid #764ba2;
        }

        .output-card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .output-card.word-mode h2 {
            border-bottom: 2px solid #667eea;
        }

        .output-card.char-mode h2 {
            border-bottom: 2px solid #764ba2;
        }

        .mode-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .word-mode .mode-badge {
            background: #667eea;
            color: white;
        }

        .char-mode .mode-badge {
            background: #764ba2;
            color: white;
        }

        .output-area {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 24px;
            line-height: 2;
            word-break: break-all;
            border: 2px solid #e0e0e0;
        }

        .output-area.empty {
            color: #999;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emoji-select {
            display: inline-block;
            position: relative;
            margin: 0 2px;
        }

        .emoji-display {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            padding: 4px 8px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 28px;
            transition: all 0.3s ease;
            vertical-align: middle;
        }

        .char-mode .emoji-display {
            border-color: #764ba2;
        }

        .emoji-display:hover {
            transform: scale(1.05);
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
        }

        .char-mode .emoji-display:hover {
            box-shadow: 0 3px 10px rgba(118, 75, 162, 0.3);
        }

        .emoji-dropdown {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 5px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 1000;
            min-width: 280px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }

        .char-mode .emoji-dropdown {
            border-color: #764ba2;
        }

        .emoji-dropdown.show {
            display: block;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .dropdown-header {
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px 10px 0 0;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .dropdown-item {
            padding: 12px 16px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 12px;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid #f0f0f0;
        }

        .dropdown-item:last-child {
            border-bottom: none;
            border-radius: 0 0 10px 10px;
        }

        .dropdown-item:hover {
            background: #667eea10;
        }

        .dropdown-item.selected {
            background: #667eea20;
            border-left: 3px solid #667eea;
        }

        .dropdown-emoji {
            font-size: 32px;
        }

        .dropdown-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dropdown-word {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .dropdown-pinyin {
            color: #666;
            font-family: monospace;
            font-size: 12px;
        }

        .dropdown-type {
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .text-unchanged {
            color: #333;
            margin: 0 2px;
        }

        .details-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .details-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 2px solid #764ba2;
            padding-bottom: 10px;
        }

        .detail-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .detail-tab {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .detail-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .detail-tab.char-tab.active {
            color: #764ba2;
            border-bottom-color: #764ba2;
        }

        .detail-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 5px;
            display: grid;
            grid-template-columns: auto 1fr auto auto auto;
            gap: 15px;
            align-items: center;
            transition: all 0.3s ease;
        }

        .char-details .detail-item {
            border-left-color: #764ba2;
        }

        .detail-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .detail-input {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .detail-arrow {
            color: #999;
            font-size: 20px;
        }

        .detail-pinyin {
            color: #666;
            font-family: monospace;
        }

        .detail-emoji {
            font-size: 32px;
        }

        .detail-source {
            color: #555;
            font-size: 14px;
        }

        .detail-type {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .type-word { background: #d4edda; color: #155724; }
        .type-pinyin_exact { background: #cce5ff; color: #004085; }
        .type-pinyin_syllable { background: #fff3cd; color: #856404; }
        .type-pinyin_fuzzy { background: #f8d7da; color: #721c24; }

        .statistics-bar {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-radius: 10px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            flex: 1;
            min-width: 120px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #dc3545;
        }

        .api-docs-link {
            text-align: center;
            margin-top: 30px;
            color: white;
            font-size: 14px;
        }

        .api-docs-link a {
            color: white;
            text-decoration: underline;
        }

        .copy-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 文字转Emoji转换器</h1>
            <p>智能拼音、谐音、模糊音匹配引擎 - 双模式转换</p>
        </div>

        <div class="input-section">
            <h2>✏️ 输入文字</h2>
            <textarea
                class="input-area"
                id="inputText"
                placeholder="在这里输入你想要转换的文字...&#10;&#10;例如：聪明&#10;试试看两种模式的不同效果！"
            ></textarea>

            <div class="controls">
                <button class="btn btn-primary" onclick="convertText()">
                    🚀 转换
                </button>

                <div class="control-group">
                    <label>模糊音匹配</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="enableFuzzy" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="examples">
                <div class="examples-title">💡 快速示例（点击填入）：</div>
                <span class="example-item" onclick="fillExample('我想吃红薯')">我想吃红薯</span>
                <span class="example-item" onclick="fillExample('聪明')">聪明 (对比两种模式)</span>
                <span class="example-item" onclick="fillExample('新年快乐')">新年快乐</span>
                <span class="example-item" onclick="fillExample('好好学习')">好好学习</span>
                <span class="example-item" onclick="fillExample('今天天气真好')">今天天气真好</span>
            </div>
        </div>

        <div class="output-grid">
            <div class="output-card word-mode">
                <h2>
                    📝 词语模式
                    <span class="mode-badge">整词匹配</span>
                </h2>
                <div class="output-area" id="wordModeOutput">
                    <span class="empty">词语模式结果将显示在这里...</span>
                </div>
                <div class="copy-btn-group">
                    <button class="btn btn-secondary" onclick="copyResult('word')">
                        📋 复制词语模式结果
                    </button>
                </div>
            </div>

            <div class="output-card char-mode">
                <h2>
                    🔤 单字模式
                    <span class="mode-badge">逐字匹配</span>
                </h2>
                <div class="output-area" id="charModeOutput">
                    <span class="empty">单字模式结果将显示在这里...</span>
                </div>
                <div class="copy-btn-group">
                    <button class="btn btn-secondary" onclick="copyResult('char')">
                        📋 复制单字模式结果
                    </button>
                </div>
            </div>
        </div>

        <div class="details-section">
            <h2>🔍 转换详情</h2>
            <div class="detail-tabs">
                <button class="detail-tab active" onclick="switchTab('word')">📝 词语模式详情</button>
                <button class="detail-tab char-tab" onclick="switchTab('char')">🔤 单字模式详情</button>
            </div>
            <div id="wordDetailsContainer">
                <p style="color: #999; text-align: center;">暂无词语模式详情</p>
            </div>
            <div id="charDetailsContainer" style="display: none;">
                <p style="color: #999; text-align: center;">暂无单字模式详情</p>
            </div>
        </div>

        <div class="api-docs-link">
            <p>API文档：<a href="/docs" target="_blank">Swagger UI (/docs)</a> | <a href="/redoc" target="_blank">ReDoc (/redoc)</a></p>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let currentWordDetails = [];
        let currentCharDetails = [];
        let openDropdownId = null;

        async function convertText() {
            const input = document.getElementById('inputText').value.trim();

            if (!input) {
                showError('请输入要转换的文字');
                return;
            }

            const enableFuzzy = document.getElementById('enableFuzzy').checked;

            try {
                showLoading();

                const response = await fetch(`${API_BASE}/api/convert`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: input,
                        mode: 'auto',
                        show_details: true,
                        enable_fuzzy: enableFuzzy,
                        enable_single_syllable: true
                    })
                });

                const data = await response.json();

                if (data.success) {
                    currentWordDetails = data.wordModeDetails || [];
                    currentCharDetails = data.charModeDetails || [];

                    showInteractiveOutput(input, data.wordModeOutput, currentWordDetails, 'word');
                    showInteractiveOutput(input, data.charModeOutput, currentCharDetails, 'char');

                    showDetails(currentWordDetails, 'word');
                    showDetails(currentCharDetails, 'char');
                } else {
                    showError(data.error || '转换失败');
                }
            } catch (error) {
                showError(`请求错误: ${error.message}`);
            }
        }

        function showLoading() {
            document.getElementById('wordModeOutput').innerHTML = '<span class="loading"></span> 转换中...';
            document.getElementById('wordModeOutput').classList.add('empty');

            document.getElementById('charModeOutput').innerHTML = '<span class="loading"></span> 转换中...';
            document.getElementById('charModeOutput').classList.add('empty');
        }

        function showInteractiveOutput(originalText, outputText, details, mode) {
            const outputArea = mode === 'word'
                ? document.getElementById('wordModeOutput')
                : document.getElementById('charModeOutput');

            if (!outputText || !details || details.length === 0) {
                if (!outputText) {
                    outputArea.innerHTML = `<span class="empty">${mode === 'word' ? '词语模式' : '单字模式'}结果将显示在这里...</span>`;
                    outputArea.classList.add('empty');
                } else {
                    outputArea.innerHTML = `<span class="text-unchanged">${escapeHtml(outputText)}</span>`;
                    outputArea.classList.remove('empty');
                }
                return;
            }

            let resultHtml = '';
            let posInOriginal = 0;

            details.forEach((detail, index) => {
                const inputStr = detail.original;

                const originalPart = originalText.substring(
                    posInOriginal,
                    originalText.indexOf(inputStr, posInOriginal)
                );

                if (originalPart) {
                    resultHtml += `<span class="text-unchanged">${escapeHtml(originalPart)}</span>`;
                }

                const emojiId = `${mode}-emoji-${index}`;
                resultHtml += `
                    <div class="emoji-select" id="${emojiId}-container">
                        <div class="emoji-display" onclick="toggleDropdown('${emojiId}', '${escapeHtml(inputStr)}', '${mode}')">
                            ${detail.emoji}
                            <span style="font-size:12px; margin-left:4px;">▼</span>
                        </div>
                        <div class="emoji-dropdown" id="${emojiId}-dropdown">
                            <div class="dropdown-header">
                                "${escapeHtml(inputStr)}" 的候选Emoji
                                <span style="float:right; font-size:12px; cursor:pointer;" onclick="closeAllDropdowns()">✕</span>
                            </div>
                            <div id="${emojiId}-candidates">
                                <div style="padding:20px; text-align:center; color:#999;">
                                    <span class="loading"></span> 加载中...
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                posInOriginal = originalText.indexOf(inputStr, posInOriginal) + inputStr.length;
            });

            const remaining = originalText.substring(posInOriginal);
            if (remaining) {
                resultHtml += `<span class="text-unchanged">${escapeHtml(remaining)}</span>`;
            }

            outputArea.innerHTML = resultHtml;
            outputArea.classList.remove('empty');
        }

        async function toggleDropdown(emojiId, inputText, mode) {
            const dropdown = document.getElementById(`${emojiId}-dropdown`);
            const candidatesContainer = document.getElementById(`${emojiId}-candidates`);

            if (openDropdownId && openDropdownId !== emojiId) {
                closeAllDropdowns();
            }

            if (dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
                openDropdownId = null;
                return;
            }

            dropdown.classList.add('show');
            openDropdownId = emojiId;

            candidatesContainer.innerHTML = `
                <div style="padding:20px; text-align:center; color:#999;">
                    <span class="loading"></span> 加载中...
                </div>
            `;

            try {
                const enableFuzzy = document.getElementById('enableFuzzy').checked;

                const response = await fetch(`${API_BASE}/api/lookup-candidates`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: inputText,
                        enable_fuzzy: enableFuzzy,
                        enable_single_syllable: true
                    })
                });

                const data = await response.json();

                if (data.success && data.candidates.length > 0) {
                    const totalCount = data.candidates.length;
                    let html = '';
                    data.candidates.forEach((cand, idx) => {
                        const typeClass = `type-${cand.indexType}`;
                        const typeLabel = getTypeLabel(cand.indexType);
                        const variantCount = cand.variantCount || 0;
                        const variantBadge = variantCount > 0
                            ? `<span style="background:#ff9800; color:white; padding:2px 6px; border-radius:8px; font-size:10px; margin-left:6px;">+${variantCount}肤色</span>`
                            : '';

                        html += `
                            <div class="dropdown-item ${idx === 0 ? 'selected' : ''}"
                                 onclick="selectEmoji('${emojiId}', '${cand.emoji}', this)">
                                <div class="dropdown-emoji">${cand.emoji}${variantBadge}</div>
                                <div class="dropdown-info">
                                    <div class="dropdown-word">${escapeHtml(cand.sourceWord)}</div>
                                    <div class="dropdown-pinyin">${escapeHtml(cand.sourcePinyin)}</div>
                                </div>
                                <div class="dropdown-type ${typeClass}">${typeLabel}</div>
                            </div>
                        `;
                    });

                    const variantTotal = data.candidates.reduce((sum, c) => sum + (c.variantCount || 0), 0);
                    const baseCount = totalCount;
                    const originalCount = totalCount + variantTotal;

                    candidatesContainer.previousElementSibling.innerHTML =
                        `"${escapeHtml(inputText)}" 的候选Emoji <span style="background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:10px; font-size:12px; margin-left:8px;">${baseCount}个</span>` +
                        (variantTotal > 0 ? `<span style="background:#ff9800; color:white; padding:2px 8px; border-radius:10px; font-size:12px; margin-left:4px;">已合并${variantTotal}个肤色变体</span>` : '') +
                        `<span style="float:right; font-size:12px; cursor:pointer;" onclick="closeAllDropdowns()">✕</span>`;

                    candidatesContainer.innerHTML = html;
                } else {
                    candidatesContainer.previousElementSibling.innerHTML =
                        `"${escapeHtml(inputText)}" 的候选Emoji` +
                        `<span style="float:right; font-size:12px; cursor:pointer;" onclick="closeAllDropdowns()">✕</span>`;
                    candidatesContainer.innerHTML = `
                        <div style="padding:20px; text-align:center; color:#999;">
                            没有找到其他候选
                        </div>
                    `;
                }
            } catch (error) {
                candidatesContainer.innerHTML = `
                    <div style="padding:20px; text-align:center; color:#dc3545;">
                        加载失败: ${error.message}
                    </div>
                `;
            }
        }

        function selectEmoji(emojiId, newEmoji, itemElement) {
            const display = document.querySelector(`#${emojiId}-container .emoji-display`);

            if (display) {
                const oldContent = display.innerHTML;
                display.innerHTML = `${newEmoji}<span style="font-size:12px; margin-left:4px;">▼</span>`;

                document.querySelectorAll(`#${emojiId}-dropdown .dropdown-item`).forEach(item => {
                    item.classList.remove('selected');
                });
                itemElement.classList.add('selected');
            }

            closeAllDropdowns();
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.emoji-dropdown.show').forEach(dropdown => {
                dropdown.classList.remove('show');
            });
            openDropdownId = null;
        }

        function showDetails(details, mode) {
            const container = mode === 'word'
                ? document.getElementById('wordDetailsContainer')
                : document.getElementById('charDetailsContainer');

            if (!details || details.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center;">没有匹配到任何Emoji</p>';
                return;
            }

            let html = '';
            details.forEach((item, index) => {
                const typeClass = `type-${item.matchType}`;
                const typeLabel = getTypeLabel(item.matchType);

                html += `
                    <div class="detail-item">
                        <div class="detail-input">${escapeHtml(item.original)}</div>
                        <div class="detail-pinyin">${escapeHtml(item.inputPinyin)}</div>
                        <div class="detail-emoji">${item.emoji}</div>
                        <div class="detail-source">${escapeHtml(item.sourceWord)}<br><small>priority=${item.priority}</small></div>
                        <div class="detail-type ${typeClass}">${typeLabel}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function switchTab(mode) {
            document.querySelectorAll('.detail-tab').forEach(tab => tab.classList.remove('active'));

            if (mode === 'word') {
                document.querySelector('.detail-tab:not(.char-tab)').classList.add('active');
                document.getElementById('wordDetailsContainer').style.display = 'block';
                document.getElementById('charDetailsContainer').style.display = 'none';
            } else {
                document.querySelector('.detail-tab.char-tab').classList.add('active');
                document.getElementById('wordDetailsContainer').style.display = 'none';
                document.getElementById('charDetailsContainer').style.display = 'block';
            }
        }

        function getTypeLabel(type) {
            const labels = {
                'word': '直接词',
                'pinyin_exact': '拼音精确',
                'pinyin_syllable': '单音节',
                'pinyin_fuzzy': '模糊音'
            };
            return labels[type] || type;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const wordContainer = document.getElementById('wordDetailsContainer');
            const charContainer = document.getElementById('charDetailsContainer');

            wordContainer.innerHTML = `<div class="error-message">${escapeHtml(message)}</div>`;
            charContainer.innerHTML = '';

            document.getElementById('wordModeOutput').innerHTML = '<span class="empty">词语模式结果将显示在这里...</span>';
            document.getElementById('wordModeOutput').classList.add('empty');

            document.getElementById('charModeOutput').innerHTML = '<span class="empty">单字模式结果将显示在这里...</span>';
            document.getElementById('charModeOutput').classList.add('empty');
        }

        async function copyResult(mode) {
            const outputArea = mode === 'word'
                ? document.getElementById('wordModeOutput')
                : document.getElementById('charModeOutput');

            if (outputArea.classList.contains('empty')) {
                alert('没有可复制的内容');
                return;
            }

            let text = '';

            const emojiDisplays = outputArea.querySelectorAll('.emoji-display');
            if (emojiDisplays.length > 0) {
                outputArea.childNodes.forEach(node => {
                    if (node.classList && node.classList.contains('text-unchanged')) {
                        text += node.textContent;
                    } else if (node.classList && node.classList.contains('emoji-select')) {
                        const display = node.querySelector('.emoji-display');
                        if (display) {
                            const emojiChar = display.textContent.replace('▼', '').trim();
                            text += emojiChar;
                        }
                    } else if (node.nodeType === Node.TEXT_NODE) {
                        text += node.textContent;
                    }
                });
            } else {
                text = outputArea.textContent;
            }

            if (!text) {
                alert('没有可复制的内容');
                return;
            }

            try {
                await navigator.clipboard.writeText(text);
                alert('已复制到剪贴板！');
            } catch (err) {
                console.error('复制失败:', err);

                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('已复制到剪贴板！');
            }
        }

        function fillExample(text) {
            document.getElementById('inputText').value = text;
            convertText();
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.emoji-select')) {
                closeAllDropdowns();
            }
        });

        document.getElementById('inputText').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                convertText();
            }
        });
    </script>
</body>
</html>
